<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>No as a Service</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      text-align: center;
      max-width: 520px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
    p {
      opacity: 0.85;
    }
    code {
      background: #020617;
      padding: 4px 8px;
      border-radius: 4px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>No as a Service</h1>
    <p>Uma API REST que entende tudo<br>e responde <strong>não</strong>.</p>

    <p>Exemplos:</p>
    <p>
      <code>GET /products</code><br />
      <code>POST /clients</code><br />
      <code>PUT /orders/123</code>
    </p>

    <p>Status padrão: <code>403 Forbidden</code></p>
  </div>
</body>
</html>
